services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: creaditn
      MYSQL_USER: ${DB_USER:-creaditn}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/db/initial-data.sql:/docker-entrypoint-initdb.d/01-initial-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./creadiTn
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/creaditn?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-creaditn}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION: 86400000
      APP_UPLOAD_DIR: /app/uploads
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE:-true}
      MAIL_SMTP_STARTTLS_REQUIRED: ${MAIL_SMTP_STARTTLS_REQUIRED:-true}
      MAIL_SMTP_SSL_TRUST: ${MAIL_SMTP_SSL_TRUST:-smtp.gmail.com}
      MAIL_FROM: ${MAIL_FROM:-}
      APP_PASSWORD_RESET_BASE_URL: ${APP_PASSWORD_RESET_BASE_URL:-http://localhost:3000/forgot-password}
      APP_PASSWORD_RESET_EXPIRY_MINUTES: ${APP_PASSWORD_RESET_EXPIRY_MINUTES:-30}
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL:-admin@bnpl.com}
      ADMIN_NOTIFICATION_EMAIL_ENABLED: ${ADMIN_NOTIFICATION_EMAIL_ENABLED:-false}
      APP_SOCKET_SERVER_URL: http://socket-server:3001
      APP_SOCKET_EMIT_SECRET: ${SOCKET_EMIT_SECRET:?SOCKET_EMIT_SECRET is required}
      APP_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bnpl.com}
      APP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      APP_CREDIT_MAX_PER_USER: ${APP_CREDIT_MAX_PER_USER:-2000}
      APP_DEV_RESET_ENABLED: ${APP_DEV_RESET_ENABLED:-false}
      APP_DEV_RESET_TOKEN: ${APP_DEV_RESET_TOKEN:-}
      APP_ERRORS_INCLUDE_DETAILS: ${APP_ERRORS_INCLUDE_DETAILS:-false}
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/api/users/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${DB_USER:-creaditn}
      PMA_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      PMA_ABSOLUTE_URI: ${PHPMYADMIN_ABSOLUTE_URI:-http://localhost:8081/}

  socket-server:
    build:
      context: ./socket-server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      SOCKET_PORT: 3001
      SOCKET_EMIT_SECRET: ${SOCKET_EMIT_SECRET:?SOCKET_EMIT_SECRET is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SOCKET_ALLOWED_ORIGINS: ${SOCKET_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8083}
      SOCKET_DEBUG: ${SOCKET_DEBUG:-false}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  dashboard:
    build:
      context: ./Dashboard_client-main
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CREDITTN_MOBILE_MODE: ${NEXT_PUBLIC_CREDITTN_MOBILE_MODE:-expo-go}
        NEXT_PUBLIC_CREDITTN_DOWNLOAD_BASE_URL: ${NEXT_PUBLIC_CREDITTN_DOWNLOAD_BASE_URL:-http://localhost:3000}
        NEXT_PUBLIC_CREDITTN_DOWNLOAD_LANDING_URL: ${NEXT_PUBLIC_CREDITTN_DOWNLOAD_LANDING_URL:-http://localhost:3000/mobile-download}
        NEXT_PUBLIC_CREDITTN_EXPO_GO_URL: ${NEXT_PUBLIC_CREDITTN_EXPO_GO_URL:-}
        NEXT_PUBLIC_CREDITTN_MOBILE_WEB_URL: ${NEXT_PUBLIC_CREDITTN_MOBILE_WEB_URL:-}
        NEXT_PUBLIC_CREDITTN_ANDROID_APK_URL: ${NEXT_PUBLIC_CREDITTN_ANDROID_APK_URL:-}
        NEXT_PUBLIC_CREDITTN_GOOGLE_PLAY_URL: ${NEXT_PUBLIC_CREDITTN_GOOGLE_PLAY_URL:-}
        NEXT_PUBLIC_CREDITTN_APP_STORE_URL: ${NEXT_PUBLIC_CREDITTN_APP_STORE_URL:-}
        NEXT_PUBLIC_CREDITTN_DEEP_LINK_SCHEME: ${NEXT_PUBLIC_CREDITTN_DEEP_LINK_SCHEME:-credittn://}
    restart: unless-stopped
    depends_on:
      - backend
      - socket-server
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8082
      NEXT_PUBLIC_API_URL: /api/backend
      NEXT_PUBLIC_SOCKET_URL: http://localhost:3001
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NEXT_PUBLIC_CREDITTN_MOBILE_MODE: ${NEXT_PUBLIC_CREDITTN_MOBILE_MODE:-expo-go}
      NEXT_PUBLIC_CREDITTN_DOWNLOAD_BASE_URL: ${NEXT_PUBLIC_CREDITTN_DOWNLOAD_BASE_URL:-http://localhost:3000}
      NEXT_PUBLIC_CREDITTN_DOWNLOAD_LANDING_URL: ${NEXT_PUBLIC_CREDITTN_DOWNLOAD_LANDING_URL:-http://localhost:3000/mobile-download}
      NEXT_PUBLIC_CREDITTN_EXPO_GO_URL: ${NEXT_PUBLIC_CREDITTN_EXPO_GO_URL:-}
      NEXT_PUBLIC_CREDITTN_MOBILE_WEB_URL: ${NEXT_PUBLIC_CREDITTN_MOBILE_WEB_URL:-}
      NEXT_PUBLIC_CREDITTN_ANDROID_APK_URL: ${NEXT_PUBLIC_CREDITTN_ANDROID_APK_URL:-}
      NEXT_PUBLIC_CREDITTN_GOOGLE_PLAY_URL: ${NEXT_PUBLIC_CREDITTN_GOOGLE_PLAY_URL:-}
      NEXT_PUBLIC_CREDITTN_APP_STORE_URL: ${NEXT_PUBLIC_CREDITTN_APP_STORE_URL:-}
      NEXT_PUBLIC_CREDITTN_DEEP_LINK_SCHEME: ${NEXT_PUBLIC_CREDITTN_DEEP_LINK_SCHEME:-credittn://}

  mobile-web:
    build:
      context: "./frontend mobile"
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_API_BASE_URL: ${EXPO_PUBLIC_API_BASE_URL:-http://localhost:8082}
        EXPO_PUBLIC_SOCKET_URL: ${EXPO_PUBLIC_SOCKET_URL:-http://localhost:3001}
    restart: unless-stopped
    depends_on:
      - backend
      - socket-server
    ports:
      - "8083:8083"

volumes:
  mysql_data:
  uploads_data:
