spring.datasource.url=jdbc:h2:mem:creaditn_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never
debug=false
logging.level.root=INFO
logging.level.org.hibernate.SQL=OFF

jwt.secret=test-jwt-secret-at-least-32-characters
app.admin.password=test-admin-password
app.admin.token-secret=test-admin-token-secret-at-least-32-characters
app.socket.emit-secret=test-socket-secret

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=
app.mail.from=test@example.com

didit.api.key=
didit.access-token=
didit.fallback-on-error=false
kyc.dev-auto-approve=false
